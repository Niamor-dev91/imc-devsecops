name: CI - Build & Test

# Quand déclencher la pipeline ?
on:
  push:
    branches: [ "main", "feature/devsecops-pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # GitHub fournit une machine Linux gratuite

    steps:
      # 1. Récupérer le code du repo
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installer Java (JDK 17)
      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Mettre en cache la base de données NVD (OWASP Dependency-Check)
      - name: Cache NVD Database
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-cache-${{ runner.os }}
          restore-keys: nvd-cache-${{ runner.os }}

      # 4. Compiler, tester et analyser les dépendances
      - name: Build & Test avec Maven
        run: mvn --batch-mode clean verify
